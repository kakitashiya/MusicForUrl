<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicForUrl</title>
  <meta name="description" content="网易云音乐、QQ 音乐、酷狗与酷我的歌单转换为播放链接。">
  <meta name="theme-color" content="#e5f6ff">
  <link rel="icon" href="/brand.svg" type="image/svg+xml">
  <script>
    // 在首屏渲染前套用主题，避免闪烁。localStorage 键与旧版前端完全一致。
    // 'system' 是新前端才认识的值，旧版读到它会当成浅色——这是有意的向后兼容。
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
      else if (theme === 'system') {
        document.documentElement.dataset.theme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } else if (theme === 'light') document.documentElement.dataset.theme = 'light';
    } catch (_) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
